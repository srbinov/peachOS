update_db: true
ignore_update_db_error: true
backend: apt
operations:
  # Only script-free packages, and nothing whose removal cascades. The old list
  # had "^live-*" -- apt expands that to live-boot-initramfs-tools, whose `remove`
  # postrm runs `update-initramfs -u`; that can exit non-zero inside the install
  # chroot, and the packages module then aborts the whole install with
  # "the package manager could not make changes ... code 100". live-boot is inert
  # on an installed system anyway (nothing passes boot=live), so it's left in
  # place. calamares* and penguins-eggs ship no maintainer scripts -> safe.
  - remove:
      - calamares
      - calamares-data
      - calamares-settings-ubuntu-common
      - calamares-settings-ubuntu-common-data
      - libcalamaresui3.3
      - penguins-eggs
  - try_install:
      - language-pack-$LOCALE
      - language-pack-gnome-$LOCALE
      - hunspell-$LOCALE
      - libreoffice-help-$LOCALE
      - libreoffice-l10n-$LOCALE
