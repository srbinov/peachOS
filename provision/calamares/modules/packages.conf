update_db: true
ignore_update_db_error: true
backend: apt
operations:
  - remove:
      - "^live-*"
      - calamares-settings-ubuntu-common
      - calamares-settings-ubuntu-common-data
      - calamares
      - calamares-data
      - libcalamaresui3.3
      - cifs-utils
  - try_install:
      - language-pack-$LOCALE
      - language-pack-gnome-$LOCALE
      - hunspell-$LOCALE
      - libreoffice-help-$LOCALE
      - libreoffice-l10n-$LOCALE
