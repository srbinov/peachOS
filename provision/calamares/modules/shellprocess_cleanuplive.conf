---
# Nothing in Calamares' own module set knows about the throwaway "live" demo account or its
# GDM autologin -- unpackfs copies the live squashfs onto the target verbatim (account, sudo
# membership, and all), and users.conf's doAutologin:false only governs the NEW account this
# same exec sequence creates a few steps earlier, not the pre-existing live-session config
# already sitting in /etc/gdm3/custom.conf. Left alone, a real install would boot straight
# back into the "live" account (undocumented default password, sudo group) instead of the
# user's own -- confirmed by reading users.conf/displaymanager.conf (basicSetup: false,
# sysconfigSetup: false -- it will not touch AutomaticLogin* on its own) rather than assumed.
dontChroot: true
timeout: 30
script:
    - chroot ${ROOT} userdel -r live 2>/dev/null || true
    - sed -i '/^AutomaticLoginEnable=/d; /^AutomaticLogin=/d' ${ROOT}/etc/gdm3/custom.conf
