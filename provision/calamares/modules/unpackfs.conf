---
# NOT verified against a real eggs-built ISO yet (flagged rather than guessed silently) --
# Kubuntu's own reference config (calamares-settings-kubuntu) points this at
# /cdrom/casper/filesystem.squashfs, the classic Ubuntu casper/ubiquity live-media layout.
# That's the WRONG path for this project: penguins-eggs' actual installed remaster template
# (/etc/penguins-eggs.d/brain.d/modules/debian/remaster.bash.tmpl, checked directly) copies
# the squashfs to $ISODIR/live/filesystem.squashfs -- a Debian-Live (live-boot) layout, not
# casper. live-boot's own convention exposes the mounted medium at /run/live/medium at
# runtime, which is what this points at -- but that's inferred from live-boot's documented
# default, not confirmed by actually booting an eggs-built ISO and checking. Re-verify this
# path the first time `eggs remaster` actually produces a bootable ISO.
unpack:
    -   source: "/run/live/medium/live/filesystem.squashfs"
        sourcefs: "squashfs"
        destination: ""
