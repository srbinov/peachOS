---
# Best-effort: an install from a USB stick may have no /cdrom mount and no
# cdrom.sources at all. A bare `rm`/`umount`/`rmdir` that hits a missing target
# returns non-zero and aborts the install, so every step is guarded.
dontChroot: true
timeout: 30
script:
    - rm -f ${ROOT}/etc/apt/sources.list.d/cdrom.sources ${ROOT}/etc/apt/sources.list.d/cdrom.list
    - sh -c "umount ${ROOT}/cdrom 2>/dev/null || true"
    - sh -c "rmdir ${ROOT}/cdrom 2>/dev/null || true"
