displaymanagers:
  - gdm3

# Verified against this actual system: /usr/share/wayland-sessions/ubuntu.desktop is the
# real installed session file (Ubuntu's own GNOME session, not a plain "gnome.desktop" --
# checked directly rather than assumed).
defaultDesktopEnvironment:
    executable: "gnome-session"
    desktopFile: "ubuntu"

basicSetup: false
sysconfigSetup: false
