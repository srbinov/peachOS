---
modules-search: [ local ]

# Only the shellprocess/contextualprocess instances peachOS's own sequence below actually
# references -- logs and rmcdrom (both generically useful, kept from the real Kubuntu 26.04
# reference this was built from: apt-get download calamares-settings-kubuntu, extracted
# without installing it to avoid its file conflicts with calamares-settings-ubuntu-common).
# Dropped the rest (bug-LP#1829805, fixconkeys_part1/2, add386arch, before_bootloader_kerncopy,
# fix-oem-uid, oemprep) -- those are Kubuntu/KDE-specific workarounds for bugs never verified
# to apply to peachOS's own GNOME setup, and shipping a workaround for an unconfirmed problem
# is worse than not shipping one at all.
instances:
- id: logs
  module: shellprocess
  config: shellprocess_logs.conf
- id: rmcdrom
  module: shellprocess
  config: shellprocess_rmcdrom.conf
- id: cleanuplive
  module: shellprocess
  config: shellprocess_cleanuplive.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
# NOTE: no `automirror` step. That module writes sources.list.d/ubuntu.sources
# with `Suites: <distro.codename()>` -- on peachOS distro.codename() is
# "savannah" (DISTRIB_CODENAME), which is not an Ubuntu suite, so every install
# ended up unable to `apt update`. It also `os.remove`s /etc/apt/sources.list
# unconditionally. The live image already carries a correct `resolute`
# ubuntu.sources; unpackfs copies it to the target as-is.
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - shellprocess@cleanuplive
  - displaymanager
  - networkcfg
  - hwclock
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - packages
  - shellprocess@rmcdrom
  - shellprocess@logs
  - umount
- show:
  - finished

branding: peachos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
