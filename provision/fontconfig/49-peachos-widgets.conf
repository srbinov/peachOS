<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Family aliases for the peachOS Desktop Widgets extension.

  Pango (and St's CSS `font-family`) parse a trailing "Condensed" / "Thin" /
  "Light" in a family name as a stretch/weight keyword, so "Barlow Condensed"
  never resolves. These keyword-free alias names map cleanly, and the *Thin
  alias also pins the weight so a single family name selects the thin face.
-->
<fontconfig>

  <alias binding="same">
    <family>PeachClock</family>
    <prefer><family>Barlow Condensed</family></prefer>
  </alias>

  <alias binding="same">
    <family>PeachRounded</family>
    <prefer><family>SF Pro Rounded</family></prefer>
  </alias>

  <alias binding="same">
    <family>PeachDisplay</family>
    <prefer><family>SF Pro Display</family></prefer>
  </alias>

  <match target="pattern">
    <test name="family"><string>PeachDisplayThin</string></test>
    <edit name="family" mode="assign" binding="same"><string>SF Pro Display</string></edit>
    <edit name="weight" mode="assign" binding="same"><const>thin</const></edit>
  </match>

</fontconfig>
